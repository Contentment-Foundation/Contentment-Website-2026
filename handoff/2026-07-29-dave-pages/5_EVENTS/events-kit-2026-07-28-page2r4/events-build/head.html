<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Teacher Wellbeing · The Contentment Foundation</title>
<meta name="description" content="Every future we care about runs through a teacher. Here is why teacher wellbeing is the work, and how your support reaches every child in the room.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#1FAFC0;--ocean:#0080B0;--deep:#024E70;--deep2:#02374f;--green:#4FA98C;
  --slate:#3C3B43;--ink:#23252b;--paper:#FBFAF7;--paper2:#F2F0EA;--mist:#E8F1F2;
  --line:rgba(2,78,112,.12);--shadow:0 18px 50px -20px rgba(2,55,79,.35);
  --display:'Newsreader',Georgia,serif;--body:'Inter',system-ui,sans-serif;
  --script:'Cedarville Cursive',cursive;
  /* palette extension - review round 1 (V); shared header/footer kit */
  --mint:#55bf98;--navlink:#515154;--btnblue:#0090be;--accent-mint:#a4dcce;--accent-sand:#f9dba5;
  --ob1:#54bf98;--ob2:#32c0cf;--ob3:#6275b4;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--body);color:var(--ink);background:var(--paper);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--ocean)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:.55em;font-weight:600;font-size:1rem;padding:.95em 1.7em;border-radius:999px;border:1.5px solid transparent;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,background .25s,color .25s}
.btn-primary{background:var(--ocean);color:#fff;box-shadow:0 10px 28px -10px rgba(0,128,176,.7)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 34px -10px rgba(0,128,176,.85);background:#0090c4}
.btn-ghost{border-color:rgba(255,255,255,.6);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.btn .arrow{transition:transform .25s}
.btn:hover .arrow{transform:translateX(4px)}

/* nav - shared header/footer kit v2 (2026-07-28): official lockup, white coin behind mark, light/dark cross-fade */
header{position:fixed;top:0;left:0;right:0;z-index:100;transition:background .4s,box-shadow .4s,padding .4s;padding:14px 0}
header.scrolled{background:#fff;box-shadow:0 6px 22px -14px rgba(2,40,58,.45);padding:10px 0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:grid;flex-shrink:0;line-height:0}
.brand img{grid-area:1/1;height:54px;width:auto;display:block;transition:opacity .4s,height .4s}
.brand-logo--dark{opacity:0}
header.scrolled .brand-logo--light{opacity:0}
header.scrolled .brand-logo--dark{opacity:1}
header.scrolled .brand img{height:47px}
.nav-links{display:flex;align-items:center;gap:26px;font-size:.9rem;font-weight:500}
.nav-links>a{color:rgba(255,255,255,.94);transition:color .3s;position:relative;background:none;border:none;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:6px 0}
header.scrolled .nav-links>a{color:var(--navlink)}
.nav-links>a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--teal);transition:width .3s}
.nav-links>a:hover::after{width:100%}
.nav-links>a[aria-current="page"]{color:#fff}
header.scrolled .nav-links>a[aria-current="page"]{color:var(--ocean)}
.nav-right{display:flex;align-items:center;gap:18px;flex-shrink:0}
.signin{font-size:.9rem;font-weight:500;color:rgba(255,255,255,.94);transition:color .3s;white-space:nowrap}
.signin:hover{color:#fff;text-decoration:underline;text-underline-offset:4px}
header.scrolled .signin{color:var(--navlink)}
header.scrolled .signin:hover{color:var(--deep)}
.nav-cta{padding:.62em 1.4em;font-size:.9rem;border-radius:999px;font-weight:600;white-space:nowrap;background:var(--mint);color:var(--deep2);transition:transform .25s,box-shadow .25s,background .35s,color .35s}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
header.scrolled .nav-cta{background:var(--btnblue);color:#fff}
.menu-btn{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:6px}
.menu-btn span{width:24px;height:2px;background:#fff;transition:background .4s}
header.scrolled .menu-btn span{background:var(--navlink)}

/* ---------- HERO (full-bleed, responsive cover) ---------- */
.hero{position:relative;height:100svh;min-height:600px;display:flex;align-items:center;color:#fff;overflow:hidden}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06);animation:heroZoom 16s ease-out forwards}
.hero-bg.mob{display:none}
@keyframes heroZoom{to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(2,40,58,.86) 0%,rgba(2,46,66,.6) 32%,rgba(2,46,66,.12) 58%,rgba(2,46,66,.04) 100%)}
.hero-inner{position:relative;z-index:2;width:100%;will-change:transform}
.hero-content{max-width:720px}
.hero .eyebrow{color:#bfeef5}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(2.6rem,5.6vw,5.2rem);line-height:1.01;letter-spacing:-.005em;margin-top:18px;text-wrap:balance;text-shadow:0 2px 40px rgba(2,40,58,.5)}
.hero h1 em{font-style:italic;color:#bfeef5}
.hero p.sub{margin-top:24px;font-size:clamp(1.05rem,1.4vw,1.28rem);max-width:48ch;color:rgba(255,255,255,.95);text-shadow:0 1px 18px rgba(2,40,58,.6)}
.hero-actions{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.scrollcue{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:2;pointer-events:none;opacity:0;animation:fadeIn .9s 1.4s forwards}
.scrollcue .dot{width:1px;height:40px;background:linear-gradient(rgba(255,255,255,.75),transparent);display:block}
@keyframes fadeIn{to{opacity:1}}

/* ---------- shared section system ---------- */
section{position:relative}
.band{padding:clamp(76px,10vw,132px) 0}
.band.homeroom{padding:0}
.band-tight{padding:clamp(56px,7vw,92px) 0}
h2.title{font-family:var(--display);font-weight:500;font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.06;letter-spacing:-.005em;color:var(--deep);text-wrap:balance}
.lead{font-size:clamp(1.12rem,1.5vw,1.4rem);color:var(--slate);max-width:60ch}
p.body{font-size:1.1rem;color:var(--slate);max-width:60ch}
p.body+p.body{margin-top:1.1em}
.pull{padding-left:22px;border-left:3px solid var(--teal);font-family:var(--display);font-style:italic;font-size:1.3rem;color:var(--deep);line-height:1.4}

/* ---------- text animation system ---------- */
.anim{opacity:0;transform:translateY(28px);transition:opacity .85s cubic-bezier(.2,.8,.2,1),transform .85s cubic-bezier(.2,.8,.2,1)}
.anim.in{opacity:1;transform:none}
.d1{transition-delay:.1s}.d2{transition-delay:.22s}.d3{transition-delay:.34s}.d4{transition-delay:.46s}.d5{transition-delay:.58s}
/* hero entrance */
.hero .anim{transition-duration:.95s}
.hero-loaded .hero .anim{opacity:1;transform:none}

/* ---------- SPLIT band (full-bleed image one side, text floating other) ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;min-height:clamp(680px,82vh,920px);max-height:1040px}
.split.img-left .split-img{order:1}.split.img-left .split-txt{order:2}
.split-img{background-size:cover;background-position:center;position:relative;min-height:380px}
.split.img-left .split-img{background-position:50% 18%}
.split-txt{display:flex;align-items:center;padding:clamp(48px,7vw,104px) clamp(36px,6vw,92px)}
.split-txt-inner{max-width:540px}
.split-txt .eyebrow{display:block;margin-bottom:18px}
.split-txt h2{margin-bottom:24px}

/* ---------- IMPACT ---------- */
.impact{background:linear-gradient(155deg,var(--green) 0%,#3C8E74 100%);color:#fff;overflow:hidden;position:relative}
.impact::before{content:"";position:absolute;width:680px;height:680px;border-radius:50%;border:1px solid rgba(255,255,255,.07);top:-220px;right:-180px;transform-origin:center;animation:rippleA 24s ease-in-out 0s infinite;will-change:transform,opacity}
.impact::after{content:"";position:absolute;width:440px;height:440px;border-radius:50%;border:1px solid rgba(255,255,255,.06);bottom:-160px;left:-120px;transform-origin:center;animation:rippleB 30s ease-in-out -8s infinite;will-change:transform,opacity}
.impact .wrap{position:relative;z-index:2}
.impact .eyebrow{color:#EAF7F1}
.impact-head{max-width:60ch;margin-bottom:54px}
.impact-head h2{color:#fff;margin-top:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;border-top:1px solid rgba(255,255,255,.16);border-bottom:1px solid rgba(255,255,255,.16);padding:44px 0}
.stat .num{font-family:var(--display);font-weight:500;font-size:clamp(2.4rem,4.5vw,3.6rem);line-height:1;letter-spacing:-.005em;color:#fff}
.stat .num .plus{color:var(--teal)}
.stat .lab{margin-top:10px;font-size:.86rem;color:rgba(255,255,255,.72)}
.impact-foot{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;margin-top:54px;align-items:center}
.impact-foot p{font-size:1.18rem;color:rgba(255,255,255,.9);line-height:1.5}
.impact-foot .big86{font-family:var(--display);color:var(--deep);font-weight:600}
.quote-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:30px 32px;backdrop-filter:blur(4px)}
.quote-card .qmark{font-family:var(--display);font-size:2.6rem;color:var(--teal);line-height:.4;display:block;margin-bottom:8px}
.quote-card blockquote{font-family:var(--display);font-style:italic;font-size:1.12rem;line-height:1.5;color:#fff}
.quote-card cite{display:block;margin-top:16px;font-style:normal;font-size:.84rem;color:rgba(255,255,255,.72);font-family:var(--body)}

/* ---------- HOW CHANGE / steps over full-bleed ---------- */
.how{background:var(--paper2)}
.how-head{max-width:60ch;margin-bottom:clamp(40px,5vw,56px)}
.how-head h2{margin-top:14px}.how-head .lead{margin-top:14px}
.how-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(40px,5vw,72px);align-items:start}
.steplist{counter-reset:s}
.step{display:flex;gap:22px;padding:22px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .n{counter-increment:s;flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid var(--teal);color:var(--ocean);font-family:var(--display);font-weight:600;font-size:1.2rem;display:grid;place-items:center}
.step .n::before{content:counter(s)}
.step h3{font-size:1.18rem;color:var(--deep);margin-bottom:5px;font-weight:600}
.step p{font-size:1rem;color:var(--slate)}
.how-aside{position:sticky;top:96px}
.how-aside .ph{border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.how-aside img{width:100%}
.how-aside .note{margin-top:20px;font-size:1.05rem;color:var(--slate);border-left:3px solid var(--green);padding-left:18px;font-style:italic;font-family:var(--display)}


/* HOW as full-bleed split */
.how-split{background:var(--paper2);align-items:stretch;min-height:auto;max-height:none}
.how-split .split-txt{padding:clamp(56px,7vw,104px) clamp(36px,6vw,88px)}
.how-inner{max-width:560px}
.how-inner .eyebrow{display:block;margin-bottom:16px}
.how-inner h2{margin-bottom:14px}
.how-sub{font-size:1.15rem;color:var(--slate);margin-bottom:30px;font-weight:500}
.how-split .steplist{counter-reset:s}
.how-img{background-position:50% 30%;position:sticky;top:0;height:100vh;align-self:start}
@media(max-width:940px){.how-img{position:relative;height:auto;min-height:60vh}}

/* ============ HOW ORBIT (pinned pond ripple) ============ */
.how-orbit{position:relative;background:linear-gradient(165deg,var(--deep) 0%,var(--deep2) 100%);color:#fff}
.orbit-sticky{position:sticky;top:0;height:100vh;display:flex;align-items:center;overflow:hidden}
.orbit-grid{position:relative;z-index:2;width:100%;display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;
  grid-template-areas:"head head" "graphic beats";
  gap:0 56px;align-items:center}
.orbit-head{grid-area:head;align-self:start;padding-top:4vh;max-width:62ch}
.orbit-head .eyebrow{color:var(--teal);display:block;margin-bottom:14px}
.orbit-title{font-family:var(--display);font-weight:500;font-size:clamp(1.9rem,3.4vw,3rem);line-height:1.05;color:#fff;letter-spacing:0}
.orbit-sub{font-size:1.1rem;color:rgba(255,255,255,.8);margin-top:14px;font-weight:500}
.orbit-graphic{grid-area:graphic;display:flex;align-items:center;justify-content:center}
.ripple{width:min(100%,460px);height:auto;overflow:visible}

/* rings: fade + scale up from center (pond ripple), no draw, no dots */
.ripple .ring{stroke:rgba(191,238,245,.8);stroke-width:2;opacity:0;
  transform:scale(.2);transform-origin:280px 280px;
  transition:opacity 1.1s cubic-bezier(.2,.7,.3,1),transform 1.2s cubic-bezier(.2,.7,.3,1),stroke .8s,stroke-width .8s}
.ripple .ring.drawn{opacity:.34;transform:scale(1)}
.ripple .ring.current{opacity:1;transform:scale(1);stroke:var(--teal);stroke-width:3;filter:drop-shadow(0 0 12px rgba(31,175,192,.7))}
.ripple .core{fill:#fff;filter:drop-shadow(0 0 14px rgba(255,255,255,.85))}
.ripple .core-glow{fill:none;stroke:#fff;stroke-width:2;opacity:.5;transform-origin:280px 280px;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{r:14;opacity:.5}50%{r:30;opacity:0}}

/* beats in right negative space, vertically centered to the dot */
.orbit-beats{grid-area:beats;position:relative;align-self:center;display:flex;align-items:center}
.beat-stage{position:relative;width:100%;min-height:300px;display:flex;flex-direction:column;justify-content:center}
.beat{position:absolute;top:50%;left:0;width:100%;opacity:0;transform:translate(0,calc(-50% + 22px));transition:opacity 1.1s cubic-bezier(.22,.7,.25,1),transform 1.1s cubic-bezier(.22,.7,.25,1);pointer-events:none}
.beat.active{opacity:1;transform:translate(0,-50%);pointer-events:auto}
.beat.past{opacity:0;transform:translate(0,calc(-50% - 22px))}
.orbit-num{display:block;font-family:var(--display);font-weight:500;font-size:clamp(3.4rem,6vw,5.6rem);line-height:.9;color:#fff;letter-spacing:-.005em;margin-bottom:6px;text-shadow:0 2px 30px rgba(31,175,192,.35)}
.beat-step{display:block;font-family:var(--body);font-weight:600;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);margin-bottom:16px}
.beat h3{font-family:var(--display);font-weight:500;font-size:clamp(1.7rem,2.8vw,2.5rem);color:#fff;margin-bottom:14px;line-height:1.08}
.beat p{font-size:1.08rem;color:rgba(255,255,255,.88);line-height:1.55;max-width:42ch}

.orbit-scroll{height:560vh}
.orbit-cue{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);z-index:5;display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:9px 16px 7px;border-radius:30px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);color:rgba(255,255,255,.9);font-family:var(--body);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;transition:opacity .6s;pointer-events:none}
.orbit-cue svg{animation:cuebob 1.5s ease-in-out infinite}
.orbit-cue.hide{opacity:0}
@keyframes cuebob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media(prefers-reduced-motion:reduce){.orbit-cue svg{animation:none}}

@media(max-width:940px){
  .orbit-sticky{position:relative;height:auto;padding:64px 0;display:block}
  .orbit-grid{grid-template-columns:1fr;grid-template-areas:"head" "graphic" "beats";gap:32px 0}
  .orbit-head{padding-top:0}
  .orbit-scroll{display:none}
  .orbit-graphic{justify-content:center}
  .ripple{width:min(64%,320px)}
  .beat-stage{min-height:0}
  .beat{position:static;opacity:1;transform:none;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.12)}
  .beat.past{opacity:1;transform:none}
  .beat:last-child{border-bottom:none}
}
@media(prefers-reduced-motion:reduce){
  .ripple .ring{transition:none;opacity:.34;transform:scale(1)}
  .core-glow{animation:none;opacity:0}
}

/* ---------- NOT ALONE / circles full-bleed strip ---------- */
.alone{background:var(--paper)}
.alone-head{text-align:center;max-width:60ch;margin:0 auto clamp(40px,5vw,60px)}
.alone-head h2{margin-top:14px}.alone-head .lead{margin:16px auto 0}
.circles{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;max-width:1100px;margin:0 auto}
.circ{position:relative;overflow:hidden;aspect-ratio:1/1;border-radius:50%;box-shadow:0 14px 34px rgba(2,55,79,.16)}
.circ img{width:100%;height:100%;object-fit:cover;transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.circ:hover img{transform:scale(1.06)}

/* ---------- FOUR PILLARS - full-bleed image w/ interactive words overlay ---------- */
.pillars{position:relative;min-height:88vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--deep)}
.pillars-bg{position:absolute;inset:-6% 0;background-size:cover;background-position:center 38%;will-change:transform}
.pillars::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,40,58,.5) 0%,rgba(2,40,58,.22) 26%,rgba(2,40,58,.6) 64%,rgba(2,40,58,.95) 100%)}
.pillars-inner{position:relative;z-index:2;width:100%;padding:clamp(48px,8vw,90px) 0}
.pillars-inner .eyebrow{color:#bfeef5}
.pillars-inner h2{color:#fff;margin-top:14px;margin-bottom:8px}
.pillars-hint{color:rgba(255,255,255,.7);font-size:.9rem;margin-bottom:36px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pcard{border-top:2px solid rgba(255,255,255,.4);padding-top:18px;cursor:pointer;transition:border-color .4s}
.pcard:hover,.pcard.open{border-color:var(--teal)}
.pcard h3{font-family:var(--display);font-weight:500;font-size:clamp(1.5rem,2.4vw,2.1rem);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard h3 .pi{font-size:1rem;color:var(--teal);transition:transform .4s;font-family:var(--body)}
.pcard.open h3 .pi{transform:rotate(45deg)}
.pcard .pdesc{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s cubic-bezier(.2,.8,.2,1),opacity .5s,margin-top .5s}
.pcard.open .pdesc{max-height:240px;opacity:1;margin-top:14px}
.pcard .pdesc p{font-size:.96rem;color:rgba(255,255,255,.88);line-height:1.5}

/* ---------- HOMEROOM (image / ask split) ---------- */
.homeroom{display:grid;grid-template-columns:0.92fr 1.08fr;align-items:stretch;min-height:clamp(640px,82vh,940px);color:#fff;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ocean) 0%,var(--deep) 62%,var(--deep2) 100%)}
.homeroom-img{position:relative;background-size:cover;background-position:60% 30%;min-height:420px}
.homeroom-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,55,79,0) 60%,rgba(2,55,79,.5) 100%)}
.homeroom-panel{background:linear-gradient(160deg,var(--ocean) 0%,var(--deep) 62%,var(--deep2) 100%);position:relative;display:flex;align-items:center;padding:clamp(48px,5.5vw,92px) clamp(34px,5vw,84px);overflow:hidden}
.homeroom-panel::before{content:"";position:absolute;width:620px;height:620px;border-radius:50%;border:1px solid rgba(255,255,255,.07);top:-220px;right:-200px;pointer-events:none;transform-origin:center;animation:rippleA 28s ease-in-out -3s infinite;will-change:transform,opacity}
.homeroom-panel::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:1px solid rgba(255,255,255,.05);bottom:-180px;right:-120px;pointer-events:none;transform-origin:center;animation:rippleB 30s ease-in-out -11s infinite;will-change:transform,opacity}
.homeroom-inner{position:relative;z-index:2;max-width:640px;width:100%}
.homeroom .eyebrow{color:#bfeef5}
.homeroom-head h2{color:#fff;margin-top:14px}
.homeroom-head p{margin-top:18px;font-size:1.1rem;color:rgba(255,255,255,.92);max-width:52ch}

/* KENYA voice band - thin interstitial, image LEFT / text RIGHT, turquoise */
.voice{display:grid;grid-template-columns:1fr 1fr;align-items:stretch;min-height:clamp(420px,52vh,560px);color:#fff;position:relative;overflow:hidden}
.voice-img{position:relative;background-size:cover;background-position:left center;min-height:320px}
.voice-img::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,40,58,0) 68%,rgba(2,40,58,.45) 100%)}
