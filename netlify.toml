# Netlify config for contentment.org
# 30 Jul 2026: cut over from the static site/ prototype to the Astro build
# (src/pages/ → dist/). Prototype passthrough (docs hub, Foundation Reach Map,
# Story Board) now lives in public/ so it ships unchanged inside dist/.
# Production target remains Vercel (TICKET-002) — this is the dev preview.

[build]
  publish = "dist"
  command = "bash scripts/copy-docs.sh public/docs && npm run build"

[build.environment]
  NODE_VERSION = "20"

# FEAT-070 — newsletter → Flodesk. A host-native function, NOT an Astro API route:
# astro.config.mjs stays `output: 'static'` with no adapter on purpose (3 Aug — the
# SSR adapter was removed over unused runtime attack surface). This gives us
# server-side FLODESK_API_KEY handling without bringing any of that back.
# Set FLODESK_API_KEY + FLODESK_SEGMENT_* in Site settings → Environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Public path matches the Vercel twin (api/newsletter.js), so the client posts to
# /api/newsletter on both hosts and src/scripts/newsletter.js needs no host check.
[[redirects]]
  from = "/api/newsletter"
  to = "/.netlify/functions/newsletter"
  status = 200
  force = true

# Get Involved slug: /give → /getinvolved (keep old bookmarks working)
[[redirects]]
  from = "/give"
  to = "/getinvolved"
  status = 301

[[redirects]]
  from = "/give/*"
  to = "/getinvolved"
  status = 301

# Security headers — interim Netlify config (migrate to Vercel in TICKET-002)
[[headers]]
  for = "/*"
  [headers.values]
    # X-Frame-Options omitted so responsive-testing tools can iframe the site.
    # Clickjacking risk is low for this marketing surface; re-add DENY if needed.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP — 3 Aug 2026. Netlify had no CSP at all while vercel.json did, so the two
    # hosts disagreed; this is the same policy as vercel.json, kept in sync by hand.
    # Every origin below was inventoried from the built dist/, not assumed:
    #   googletagmanager     GA4 gtag.js (PUBLIC_GA_ID)
    #   cmp.osano.com        Osano CMP script + its injected stylesheet
    #   *.clarity.ms         Microsoft Clarity
    #   *.posthog.com        PostHog array.js + event ingest (app./us.i. both match)
    #   cdn.jsdelivr.net     D3 + topojson-client on /foundation-reach-map and
    #                        /story-board — these are served by this same /* rule,
    #                        so omitting it would blank both prototypes
    #   youtube + youtube-nocookie  video embeds on /events, /why, /our-impact,
    #                        /schools; BOTH are used (some built inline, some
    #                        injected by JS) and a missing frame-src silently
    #                        renders an empty box rather than erroring
    #   docs.google.com      school discovery form iframe (FEAT-041, Phase 2)
    #   cdn.keela.co         Keela Forms master CSS/JS (FEAT-060)
    #   *.keela.co           Keela donate embed iframe + API (give-usa.keela.co)
    #   *.ingest*.sentry.io  Sentry, once SENTRY_DSN lands (DECISION-006)
    # 'unsafe-inline' is required: Astro `is:inline` blocks, the gtag bootstrap and
    # the Osano snippet are all inline. img-src stays a broad `https:` on purpose —
    # images come from ytimg, filesusr, pexels and Wix, and the exfil risk from an
    # image URL is low enough that enumerating them isn't worth the breakage.
    # frame-ancestors is deliberately absent, matching the X-Frame-Options note above.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cmp.osano.com https://www.clarity.ms https://*.clarity.ms https://*.posthog.com https://cdn.jsdelivr.net https://cdn.keela.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cmp.osano.com https://cdn.keela.co; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.clarity.ms https://*.clarity.ms https://*.posthog.com https://cmp.osano.com https://api.flodesk.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.keela.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://docs.google.com https://*.flodesk.com https://*.keela.co https://*.raisely.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self' https://*.keela.co;"

